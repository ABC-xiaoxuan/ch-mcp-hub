name: Release MCP Hub Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify version matches git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('manifest.json','utf8')).version)")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Run unit tests & performance checks
        run: npm test

      - name: Pack and statically audit release bundle
        run: npm run pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/mcp-hub-${VERSION}.zip" \
            "dist/icon.png" \
            "dist/preview-dark.png" \
            "dist/preview-light.png" \
            --title "MCP Hub ${GITHUB_REF_NAME}" \
            --generate-notes
